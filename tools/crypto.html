<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Cofre Criptografado</title>
    <style>
        body { font-family: monospace; background: #0f1115; color: #f1f5f9; padding: 30px; max-width: 600px; margin: 0 auto; }
        .box { background: #161920; padding: 20px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; margin-bottom: 20px; }
        input, button { width: 100%; background: #1c2029; color: #fff; border: 1px solid rgba(255,255,255,.15); padding: 10px; margin: 8px 0; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { background: #38bdf8; color: #0f1115; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #0284c7; color: #fff; }
        pre { background: #0d0f13; padding: 15px; border-radius: 8px; color: #38bdf8; overflow-x: auto; border: 1px dashed rgba(56,189,248,.3); }
    </style>
</head>
<body>

    <h2>Gerador de Cofre (AES-GCM + PBKDF2)</h2>
    <div class="box">
        <label>Token Real do GitHub (ex: ghp_...)</label>
        <input type="password" id="inputToken" placeholder="Cole seu token real aqui">
        
        <label>Senha Mestre (ex: senhaforte)</label>
        <input type="password" id="inputSenha" placeholder="Digite sua senha mestre">
        
        <button onclick="gerarCofre()">Gerar Objeto do Cofre</button>
    </div>

    <div class="box">
        <h3>Resultado para colocar no HTML:</h3>
        <pre id="resultado">Preencha os campos acima e clique em gerar...</pre>
    </div>

<script>
function bufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
}

async function gerarCofre() {
    const token = document.getElementById("inputToken").value.trim();
    const senha = document.getElementById("inputSenha").value.trim();

    if (!token || !senha) {
        return alert("Preencha o token e a senha mestre!");
    }

    try {
        const enc = new TextEncoder();
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv = window.crypto.getRandomValues(new Uint8Array(12));

        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", enc.encode(senha), { name: "PBKDF2" }, false, ["deriveKey"]
        );

        const chave = await window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt"]
        );

        const ciphertext = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv }, chave, enc.encode(token)
        );

        const cofreObj = {
            salt: bufferToBase64(salt),
            iv: bufferToBase64(iv),
            ciphertext: bufferToBase64(ciphertext)
        };

        // Formata o texto para você copiar e colar direto no código do seu gerenciador de boletos
        const codigoFormatado = `const COFRE_EMBUTIDO = {\n` +
                                `    salt: "${cofreObj.salt}",\n` +
                                `    iv: "${cofreObj.iv}",\n` +
                                `    ciphertext: "${cofreObj.ciphertext}"\n` +
                                `};`;

        document.getElementById("resultado").innerText = codigoFormatado;
    } catch (e) {
        alert("Erro ao gerar criptografia: " + e.message);
    }
}
</script>

</body>
</html>
